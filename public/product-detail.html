<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Getoify — Product</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FDFCF9; --cream-bg: #F7F5F0; --cream-mid: #F0EDE6;
      --border: #E0DDD6; --ink: #1C1B18; --ink-mid: #3D3C38;
      --ink-muted: #5C5850; --ink-faint: #8B8070; --accent: #8B7355; --green: #6BAF8A;
    }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); background: var(--cream-bg); -webkit-font-smoothing: antialiased; }
    .app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
    .sb { background: var(--cream); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sb-logo { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 500; color: var(--ink); }
    .sb-logo span { color: var(--accent); }
    .sb-store { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .sb-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; flex-shrink: 0; }
    .sb-store-name { font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-nav { padding: 10px; flex: 1; }
    .sb-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-faint); text-transform: uppercase; padding: 12px 8px 4px; }
    .sb-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 5px; font-size: 13px; color: var(--ink-muted); cursor: pointer; margin-bottom: 1px; text-decoration: none; transition: background 0.1s; }
    .sb-item:hover { background: var(--cream-mid); color: var(--ink); }
    .sb-item.act { background: var(--cream-mid); color: var(--ink); font-weight: 500; }
    .sb-item i { font-size: 15px; opacity: 0.8; }
    .sb-item.act i { opacity: 1; }
    .sb-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
    .sb-av { width: 28px; height: 28px; border-radius: 50%; background: var(--cream-mid); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: var(--accent); flex-shrink: 0; }
    .sb-un { font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .main { display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: var(--cream); border-bottom: 1px solid var(--border); padding: 0 24px; height: 50px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .tb-left { display: flex; align-items: center; gap: 8px; }
    .tb-back { font-size: 12px; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; gap: 4px; text-decoration: none; }
    .tb-back:hover { color: var(--ink); }
    .tb-sep { color: var(--border); }
    .tb-title { font-size: 14px; font-weight: 500; color: var(--ink); }
    .btn-outline { background: var(--cream); color: var(--ink); border: 1px solid var(--border); border-radius: 5px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .body { padding: 20px 24px; overflow-y: auto; flex: 1; max-width: 720px; }
    .section { background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--ink-faint); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 12px; }
    .field-row { display: flex; align-items: flex-start; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--cream-mid); gap: 16px; }
    .field-row:last-child { border-bottom: none; padding-bottom: 0; }
    .field-row:first-child { padding-top: 0; }
    .field-lbl { font-size: 12px; color: var(--ink-muted); font-weight: 500; flex-shrink: 0; min-width: 140px; }
    .field-val { font-size: 12px; color: var(--ink); text-align: right; line-height: 1.5; }
    .field-val.desc { text-align: left; color: var(--ink-mid); font-size: 12px; line-height: 1.6; }
    .char { font-size: 10px; color: var(--ink-faint); margin-left: 6px; }
    .char.ok { color: var(--green); }
    .char.warn { color: var(--amber, #C9A96E); }
    .seo-box { background: var(--cream-bg); border-radius: 6px; padding: 12px 14px; }
    .seo-url { font-size: 11px; color: #5f9e5f; margin-bottom: 3px; }
    .seo-title { font-size: 14px; color: #1a0dab; font-weight: 500; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .seo-desc { font-size: 12px; color: var(--ink-muted); line-height: 1.5; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 9px; border-radius: 4px; font-weight: 500; background: #E8F3EC; color: #3D7A56; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
    .loading { text-align: center; padding: 3rem; color: var(--ink-faint); font-size: 13px; }
    @media (max-width: 768px) { .app { grid-template-columns: 1fr; } .sb { display: none; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-logo">Getoify<span>.</span></div>
    <div class="sb-store"><div class="sb-dot"></div><div class="sb-store-name" id="sb-shop">Loading...</div></div>
    <nav class="sb-nav">
      <a class="sb-item" href="#" onclick="nav(event,'/dashboard')"><i class="ti ti-layout-dashboard"></i>Overview</a>
      <a class="sb-item act" href="#" onclick="nav(event,'/products-page')"><i class="ti ti-stack"></i>Products</a>
      <div class="sb-lbl">Setup</div>
      <a class="sb-item" href="#" onclick="nav(event,'/tone')"><i class="ti ti-adjustments"></i>Tone Setup</a>
      <a class="sb-item" href="#" onclick="nav(event,'/glossary')"><i class="ti ti-book"></i>Glossary</a>
      <div class="sb-lbl">Automation</div>
      <a class="sb-item" href="#" onclick="nav(event,'/autosync')"><i class="ti ti-refresh"></i>Auto-Sync</a>
      <a class="sb-item" href="#"><i class="ti ti-shield-check"></i>QA Rules</a>
      <a class="sb-item" href="#"><i class="ti ti-search"></i>SEO Pack</a>
      <div class="sb-lbl">Account</div>
      <a class="sb-item" href="#" onclick="nav(event,'/settings')"><i class="ti ti-settings"></i>Settings</a>
    </nav>
    <div class="sb-foot"><div class="sb-av" id="sb-av">?</div><div class="sb-un" id="sb-shop2">—</div></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <a class="tb-back" href="#" onclick="nav(event,'/products-page')"><i class="ti ti-arrow-left"></i>Products</a>
        <span class="tb-sep">/</span>
        <span class="tb-title" id="tb-title">Loading...</span>
      </div>
      <button class="btn-outline" onclick="nav(event,'/products-page')">Back</button>
    </div>

    <div class="body">
      <div id="content"><div class="loading">Loading translation...</div></div>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const shop = params.get('shop') || localStorage.getItem('getoify_shop');
  const productId = params.get('productId');
  const productTitle = params.get('productTitle') || 'Product';

  if (shop) {
    localStorage.setItem('getoify_shop', shop);
    document.getElementById('sb-shop').textContent = shop;
    document.getElementById('sb-shop2').textContent = shop;
    document.getElementById('sb-av').textContent = shop.substring(0, 2).toUpperCase();
    document.getElementById('tb-title').textContent = productTitle;
  }

  function nav(e, page) { e.preventDefault(); window.location.href = page + '?shop=' + shop; }

  function charClass(len, max) { return len <= max * 0.8 ? 'ok' : len <= max ? 'ok' : 'warn'; }

  async function loadData() {
    try {
      const res = await fetch('/product-translations?shop=' + shop + '&productId=' + productId);
      const data = await res.json();

      if (!data.translations || !data.translations.length) {
        document.getElementById('content').innerHTML = '<div class="loading">No translations found for this product.</div>';
        return;
      }

      const html = data.translations.map(t => {
        const titleLen = (t.translated_title || '').length;
        const metaTitleLen = (t.meta_title || '').length;
        const metaDescLen = (t.meta_description || '').length;
        const langFlags = { de: '🇩🇪', fr: '🇫🇷', it: '🇮🇹', es: '🇪🇸', nl: '🇳🇱', pt: '🇵🇹' };
        const flag = langFlags[t.locale] || '';

        return `
          <div class="section">
            <div class="section-title">${flag} ${t.locale.toUpperCase()} — Translation</div>
            <div class="field-row">
              <div class="field-lbl">Translated title</div>
              <div class="field-val">${t.translated_title || '—'} <span class="char ${charClass(titleLen, 60)}">${titleLen} chars</span></div>
            </div>
            <div class="field-row" style="flex-direction:column;gap:6px">
              <div class="field-lbl">Description</div>
              <div class="field-val desc">${t.translated_description || '—'}</div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">${flag} SEO Preview</div>
            <div class="seo-box" style="margin-bottom:12px">
              <div class="seo-url">${shop} › products › ${productTitle.toLowerCase().replace(/\s+/g,'-')}</div>
              <div class="seo-title">${t.meta_title || t.translated_title || '—'}</div>
              <div class="seo-desc">${t.meta_description || '—'}</div>
            </div>
            <div class="field-row">
              <div class="field-lbl">meta_title</div>
              <div class="field-val">${t.meta_title || '—'} <span class="char ${charClass(metaTitleLen, 60)}">${metaTitleLen}/60</span></div>
            </div>
            <div class="field-row">
              <div class="field-lbl">meta_description</div>
              <div class="field-val">${metaDescLen}/160 <span class="char ${charClass(metaDescLen, 160)}">${charClass(metaDescLen,160) === 'ok' ? '✓' : '!'}</span></div>
            </div>
            <div class="field-row">
              <div class="field-lbl">Status</div>
              <div class="field-val"><span class="status-badge"><span class="status-dot"></span>${t.status}</span></div>
            </div>
            <div class="field-row">
              <div class="field-lbl">Translated at</div>
              <div class="field-val">${new Date(t.created_at).toLocaleString()}</div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('content').innerHTML = html;
    } catch(e) {
      document.getElementById('content').innerHTML = '<div class="loading">Error loading data.</div>';
    }
  }

  if (shop && productId) loadData();
</script>
</body>
</html>
