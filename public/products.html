<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Getoify — Products</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FDFCF9; --cream-bg: #F7F5F0; --cream-mid: #F0EDE6;
      --border: #E0DDD6; --ink: #1C1B18; --ink-mid: #3D3C38;
      --ink-muted: #5C5850; --ink-faint: #8B8070; --accent: #8B7355;
      --green: #6BAF8A; --amber: #C9A96E; --red: #C97070; --blue: #7B9EC9;
    }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); background: var(--cream-bg); -webkit-font-smoothing: antialiased; }
    .app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
    .sb { background: var(--cream); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sb-logo { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 500; color: var(--ink); }
    .sb-logo span { color: var(--accent); }
    .sb-store { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .sb-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; flex-shrink: 0; }
    .sb-store-name { font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-nav { padding: 10px; flex: 1; }
    .sb-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-faint); text-transform: uppercase; padding: 12px 8px 4px; }
    .sb-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 5px; font-size: 13px; color: var(--ink-muted); cursor: pointer; margin-bottom: 1px; text-decoration: none; transition: background 0.1s; }
    .sb-item:hover { background: var(--cream-mid); color: var(--ink); }
    .sb-item.act { background: var(--cream-mid); color: var(--ink); font-weight: 500; }
    .sb-item i { font-size: 15px; opacity: 0.8; }
    .sb-item.act i { opacity: 1; }
    .sb-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
    .sb-av { width: 28px; height: 28px; border-radius: 50%; background: var(--cream-mid); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: var(--accent); flex-shrink: 0; }
    .sb-un { font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .main { display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: var(--cream); border-bottom: 1px solid var(--border); padding: 0 22px; height: 50px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .tb-title { font-size: 14px; font-weight: 500; color: var(--ink); }
    .tb-right { display: flex; gap: 8px; }
    .btn-dark { background: var(--ink); color: var(--cream); border: none; border-radius: 5px; padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'DM Sans', sans-serif; }
    .btn-dark:hover { background: #333; }
    .btn-outline { background: var(--cream); color: var(--ink); border: 1px solid var(--border); border-radius: 5px; padding: 6px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'DM Sans', sans-serif; }
    .btn-outline:hover { background: var(--cream-mid); }
    .body { padding: 18px 22px; overflow-y: auto; flex: 1; }
    .filters { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .search { display: flex; align-items: center; gap: 8px; background: var(--cream); border: 1px solid var(--border); border-radius: 5px; padding: 7px 12px; flex: 1; max-width: 260px; }
    .search i { font-size: 14px; color: var(--ink-faint); }
    .search input { border: none; background: transparent; font-size: 13px; color: var(--ink); outline: none; width: 100%; font-family: 'DM Sans', sans-serif; }
    .search input::placeholder { color: var(--ink-faint); }
    .filter-tabs { display: flex; gap: 4px; }
    .ftab { font-size: 12px; padding: 5px 12px; border-radius: 5px; border: 1px solid var(--border); background: var(--cream); color: var(--ink-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.1s; }
    .ftab:hover { background: var(--cream-mid); color: var(--ink); }
    .ftab.on { background: var(--cream-mid); color: var(--ink); border-color: #D4CEC5; font-weight: 500; }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .sr { background: var(--cream); border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    .sr-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .sr-num { font-size: 16px; font-weight: 500; color: var(--ink); }
    .sr-lbl { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }
    .tbl-card { background: var(--cream); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 10px; font-weight: 600; color: var(--ink-faint); text-align: left; padding: 9px 16px; letter-spacing: 0.06em; background: var(--cream); border-bottom: 1px solid var(--border); }
    td { font-size: 12px; color: var(--ink-mid); padding: 10px 16px; border-top: 1px solid var(--cream-mid); vertical-align: middle; }
    tr:hover td { background: var(--cream-bg); }
    .prod-nm { color: var(--ink); font-weight: 500; font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lang-pills { display: flex; gap: 4px; flex-wrap: wrap; min-width: 60px; }
    .lpill { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 500; }
    .lp-done { background: #E8F3EC; color: #3D7A56; }
    .lp-none { background: var(--cream-mid); color: var(--ink-faint); }
    .st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; }
    .st-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .d-gr { background: var(--green); } .d-gy { background: var(--ink-faint); }
    .d-sp { background: var(--blue); animation: st-spin 0.8s linear infinite; }
    @keyframes st-spin { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
    .action-btn { font-size: 11px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--cream); color: var(--ink-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.1s; }
    .action-btn:hover { background: var(--cream-mid); color: var(--ink); }
    .pager { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); }
    .pager-info { font-size: 12px; color: var(--ink-faint); }
    .pager-btns { display: flex; gap: 4px; }
    .pg-btn { font-size: 12px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--cream); color: var(--ink-muted); cursor: pointer; }
    .pg-btn.cur { background: var(--cream-mid); color: var(--ink); font-weight: 500; }
    .loading { text-align: center; padding: 2rem; color: var(--ink-faint); font-size: 13px; }
    @media (max-width: 768px) { 
      .app { grid-template-columns: 1fr; } 
      .sb { display: none; position: fixed; inset: 0; z-index: 200; width: 240px; }
      .sb.open { display: flex; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { min-width: 480px; }
      .mob-menu-btn { display: flex !important; }
      .topbar { padding: 0 12px; height: 44px; }
      .btn { font-size: 11px; padding: 5px 8px; gap: 3px; }
      .btn i { font-size: 11px; }
      .btn span { display: none; }
      .btn-dark { font-size: 11px; padding: 5px 10px; }
    }
    .mob-menu-btn { display: none; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 5px; background: var(--cream); cursor: pointer; }
    .mob-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 199; }
    .mob-overlay.open { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .limit-banner { display:none; background:#FFF8EC; border:1px solid #E8C96E; border-radius:8px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .limit-banner-text { font-size:13px; color:#7A5C1E; display:flex; align-items:center; gap:8px; }
    .limit-banner-btn { background:#C8A84B; color:#fff; border:none; border-radius:5px; padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:'DM Sans',sans-serif; text-decoration:none; }
    .limit-banner-btn:hover { background:#b8943b; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sidebar">
    <div class="sb-logo"><img src="/images/logo-wordmark.png" height="28" alt="Getoify" style="display:block;"></div>
    <div class="sb-store"><div class="sb-dot"></div><div class="sb-store-name" id="sb-shop">Loading...</div></div>
    <nav class="sb-nav">
      <a class="sb-item" href="#" onclick="nav(event,'/dashboard')"><i class="ti ti-layout-dashboard"></i>Overview</a>
      <a class="sb-item act" href="#" onclick="nav(event,'/products-page')"><i class="ti ti-stack"></i>Products</a>
      <div class="sb-lbl">Setup</div>
      <a class="sb-item" href="#" onclick="nav(event,'/tone')"><i class="ti ti-adjustments"></i>Tone Setup</a>
      <a class="sb-item" href="#" onclick="nav(event,'/glossary')"><i class="ti ti-book"></i>Glossary</a>
      <div class="sb-lbl">Automation</div>
      <a class="sb-item" href="#" onclick="nav(event,'/autosync')"><i class="ti ti-refresh"></i>Auto-Sync</a>
      <div class="sb-lbl">Account</div>
      <a class="sb-item" href="#" onclick="nav(event,'/settings')"><i class="ti ti-settings"></i>Settings</a>
    </nav>
    <div class="sb-foot">
      <div class="sb-av" id="sb-av">?</div>
      <div class="sb-un" id="sb-shop2">—</div>
    </div>
  </aside>

  <div class="mob-overlay" id="mob-overlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="mob-menu-btn" onclick="openSidebar()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="tb-title">Products</div>
      </div>
      <div class="tb-right">
        <button class="btn-outline"><i class="ti ti-refresh"></i>Sync from Shopify</button>
        <button class="btn-dark" id="translate-missing-btn" onclick="runTranslate()"><i class="ti ti-player-play"></i>Translate Missing</button>
      </div>
    </div>

    <div class="body">
      <div class="filters">
        <div class="search"><i class="ti ti-search"></i><input id="search-inp" placeholder="Search products..." oninput="filterProducts()"></div>
        <div class="filter-tabs">
          <button class="ftab on" onclick="setFilter('all',this)">All <span id="count-all" style="color:#BCB8AF;font-weight:400">0</span></button>
          <button class="ftab" onclick="setFilter('done',this)">Localized</button>
          <button class="ftab" onclick="setFilter('pending',this)">Pending</button>
        </div>
      </div>


      <div class="limit-banner" id="limit-banner" style="display:none;">
        <div class="limit-banner-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8A84B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          You've reached your product limit. Upgrade to translate more products.
        </div>
        <a class="limit-banner-btn" id="limit-upgrade-btn" href="#">Upgrade plan</a>
      </div>
      <div class="stats-row">
        <div class="sr"><div class="sr-dot" style="background:#6BAF8A"></div><div><div class="sr-num" id="s-done">0</div><div class="sr-lbl">Localized</div></div></div>
        <div class="sr"><div class="sr-dot" style="background:#C9A96E"></div><div><div class="sr-num" id="s-partial">0</div><div class="sr-lbl">Partial</div></div></div>
        <div class="sr"><div class="sr-dot" style="background:#BCB8AF"></div><div><div class="sr-num" id="s-none">0</div><div class="sr-lbl">Not started</div></div></div>
        <div class="sr"><div class="sr-dot" style="background:#8B7355"></div><div><div class="sr-num" id="s-total">0</div><div class="sr-lbl">Total</div></div></div>
      </div>

      <div class="tbl-card">
        <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>PRODUCT</th>
              <th>LANGUAGES</th>
              <th>STATUS</th>
              <th>DATE</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbl-body">
            <tr><td colspan="5" class="loading">Loading products...</td></tr>
          </tbody>
        </table>
        </div>
        <div class="pager">
          <div class="pager-info" id="pager-info">—</div>
          <div class="pager-btns" id="pager-btns"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const shop = new URLSearchParams(window.location.search).get('shop') || localStorage.getItem('getoify_shop');
  const token = localStorage.getItem('getoify_token');
  if (shop) {
    localStorage.setItem('getoify_shop', shop);
    document.getElementById('sb-shop').textContent = shop;
    document.getElementById('sb-shop2').textContent = shop;
    document.getElementById('sb-av').textContent = shop.substring(0, 2).toUpperCase();
  } else { window.location.href = '/'; }

  function nav(e, page) { e.preventDefault(); window.location.href = page + '?shop=' + shop; }

  const langFlags = { de: '🇩🇪', fr: '🇫🇷', it: '🇮🇹', es: '🇪🇸', nl: '🇳🇱', pt: '🇵🇹', 'pt-BR': '🇧🇷', 'pt-br': '🇧🇷', pl: '🇵🇱', ja: '🇯🇵', hi: '🇮🇳', id: '🇮🇩', en: '🇺🇸', 'en-GB': '🇺🇸', 'en-US': '🇺🇸', 'en-AU': '🇺🇸', 'en-CA': '🇺🇸', zh: '🇨🇳', ar: '🇸🇦', ko: '🇰🇷', sv: '🇸🇪', da: '🇩🇰', fi: '🇫🇮', nb: '🇳🇴' };
  let allProducts = [];
  let translatedMap = {};
  let activeFilter = 'all';
  let currentPage = 1;
  const perPage = 100;

  async function loadData() {
    try {
      translatedMap = {};
      // Always fetch status first to get translations
      const statusRes = await fetch('/status?shop=' + shop);
      const statusData = await statusRes.json();

      statusData.translations.forEach(t => {
        const pid = String(t.product_id);
        if (!translatedMap[pid]) translatedMap[pid] = [];
        if (!translatedMap[pid].includes(t.locale)) translatedMap[pid].push(t.locale);
      });

      // Try to get token from URL or localStorage or store settings
      let activeToken = token;
      if (!activeToken) {
        try {
          const settingsRes = await fetch('/store-settings?shop=' + shop);
          const settings = await settingsRes.json();
          activeToken = settings.access_token || null;
        } catch(e) {}
      }

      if (activeToken) {
        // Fetch real product list from Shopify via backend
        try {
          const productsRes = await fetch('/products?shop=' + shop + '&token=' + activeToken);
          const prodData = await productsRes.json();
          if (prodData.products && prodData.products.length > 0) {
            allProducts = prodData.products.map(p => ({
              id: String(p.id),
              title: p.title,
              created_at: p.created_at
            }));
          } else {
            throw new Error('Empty products from Shopify');
          }
        } catch(shopifyErr) {
          console.error('Shopify products failed:', shopifyErr);
          // Fallback: use translations
          const seen = {};
          allProducts = statusData.translations
            .filter(t => { const k = String(t.product_id); if (seen[k]) return false; seen[k] = true; return true; })
            .map(t => ({ id: String(t.product_id), title: t.original_title || t.translated_title, created_at: t.created_at }));
        }
      } else {
        // No token — fallback to translations
        const seen = {};
        allProducts = statusData.translations
          .filter(t => { const k = String(t.product_id); if (seen[k]) return false; seen[k] = true; return true; })
          .map(t => ({ id: String(t.product_id), title: t.original_title || t.translated_title, created_at: t.created_at }));
      }

      updateStats();
      renderTable();
      // Check plan limit and show banner
      try {
        const stRes = await fetch('/status?shop=' + shop);
        const stData = await stRes.json();
        if (stData.plan_limit && stData.period_used >= stData.plan_limit) {
          const banner = document.getElementById('limit-banner');
          const upgradeBtn = document.getElementById('limit-upgrade-btn');
          if (banner) {
            banner.style.display = 'flex';
            banner.querySelector('.limit-banner-text').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8A84B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> You\'ve reached your ' + stData.plan_limit + '-product limit. Upgrade to translate more products.';
          }
          if (upgradeBtn) upgradeBtn.href = '/pricing?shop=' + shop;
        }
      } catch(e) {}
    } catch(e) {
      document.getElementById('tbl-body').innerHTML = '<tr><td colspan="5" class="loading">Error loading products</td></tr>';
    }
  }

  function getLocalesForProduct(productId) {
    return translatedMap[String(productId)] || [];
  }

  function getStatus(p) {
    const locales = getLocalesForProduct(p.id);
    if (locales.length > 0) return 'done';
    if (p.created_at) {
      const ageMs = Date.now() - new Date(p.created_at).getTime();
      if (ageMs >= 0 && ageMs < 5 * 60 * 1000) return 'processing';
    }
    return 'none';
  }

  function updateStats() {
    document.getElementById('s-total').textContent = allProducts.length;
    document.getElementById('count-all').textContent = allProducts.length;
    document.getElementById('s-done').textContent = allProducts.filter(p => getStatus(p) === 'done').length;
    document.getElementById('s-partial').textContent = 0;
    document.getElementById('s-none').textContent = allProducts.filter(p => getStatus(p) === 'none').length;
  }

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.ftab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentPage = 1;
    renderTable();
  }

  function filterProducts() { currentPage = 1; renderTable(); }

  function renderTable() {
    const q = document.getElementById('search-inp').value.toLowerCase();
    let filtered = allProducts.filter(p => !q || (p.title || '').toLowerCase().includes(q));
    if (activeFilter === 'done') filtered = filtered.filter(p => getStatus(p) === 'done');
    if (activeFilter === 'pending') filtered = filtered.filter(p => getStatus(p) === 'none');

    // Sort: recently translated first, not started last
    filtered.sort((a, b) => {
      const aDate = a.created_at ? new Date(a.created_at) : new Date(0);
      const bDate = b.created_at ? new Date(b.created_at) : new Date(0);
      return bDate - aDate;
    });

    const total = filtered.length;
    const pages = Math.ceil(total / perPage);
    const start = (currentPage - 1) * perPage;
    const slice = filtered.slice(start, start + perPage);

    document.getElementById('pager-info').textContent = total ? `Showing ${start + 1}–${Math.min(start + perPage, total)} of ${total} products` : 'No products';

    const pagerBtns = document.getElementById('pager-btns');
    pagerBtns.innerHTML = pages > 1 ? `
      <button class="pg-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled style="opacity:0.4"' : ''}>←</button>
      ${Array.from({length: Math.min(pages, 5)}, (_, i) => i + 1).map(p2 =>
        `<button class="pg-btn ${p2 === currentPage ? 'cur' : ''}" onclick="changePage(${p2})">${p2}</button>`
      ).join('')}
      <button class="pg-btn" onclick="changePage(${currentPage + 1})" ${currentPage >= pages ? 'disabled style="opacity:0.4"' : ''}>→</button>
    ` : '';

    if (!slice.length) {
      document.getElementById('tbl-body').innerHTML = '<tr><td colspan="5" class="loading">No products found</td></tr>';
      return;
    }

    document.getElementById('tbl-body').innerHTML = slice.map(p => {
      const locales = getLocalesForProduct(p.id);
      const status = getStatus(p);
      const statusHtml = status === 'done'
        ? '<div class="st"><div class="st-dot d-gr"></div>Localized</div>'
        : status === 'processing'
        ? '<div class="st"><div class="st-dot d-sp"></div>Processing...</div>'
        : '<div class="st"><div class="st-dot d-gy"></div>Not started</div>';
      const pillsHtml = locales.length
        ? (() => {
            const MAX = 3;
            const shown = locales.slice(0, MAX);
            const rest = locales.length - MAX;
            const pills = shown.map(l => {
              const flag = langFlags[l] || l.split('-')[0].toUpperCase();
              return `<span class="lpill lp-done" style="font-size:13px;padding:1px 3px;line-height:1">${flag}</span>`;
            }).join('');
            const more = rest > 0 ? `<span class="lpill lp-done" style="color:var(--ink-faint)">+${rest}</span>` : '';
            return pills + more;
          })()
        : '<span class="lpill lp-none">No translations</span>';
      const date = p.created_at ? new Date(p.created_at).toLocaleDateString() : '—';
      const btn = status === 'none'
        ? `<button class="action-btn translate-btn" data-id="${p.id}" data-title="${encodeURIComponent(p.title)}">Translate</button>`
        : `<button class="action-btn" onclick="viewProduct(${p.id}, this)">View</button>`;

      return `<tr>
        <td><div class="prod-nm">${p.title || '—'}</div></td>
        <td><div class="lang-pills">${pillsHtml}</div></td>
        <td>${statusHtml}</td>
        <td style="color:#8B8070">${date}</td>
        <td>${btn}</td>
      </tr>`;
    }).join('');
  }

  function changePage(p2) {
    const q = document.getElementById('search-inp').value.toLowerCase();
    let filtered = allProducts.filter(prod => !q || (prod.title || '').toLowerCase().includes(q));
    const pages = Math.ceil(filtered.length / perPage);
    if (p2 < 1 || p2 > pages) return;
    currentPage = p2;
    renderTable();
  }

  function viewProduct(productId, btn) {
    const row = btn.closest('tr');
    const title = row ? row.querySelector('.prod-nm').textContent : '';
    window.location.href = '/product?shop=' + shop + '&productId=' + productId + '&productTitle=' + encodeURIComponent(title);
  }

  async function runTranslate() {
    if (!token) { alert('Please reconnect your store first.'); return; }
    const pending = allProducts.filter(p => getStatus(p) === 'none').length;
    if (pending === 0) { alert('All products are already translated.'); return; }
    if (!confirm(`Translate ${pending} untranslated product${pending > 1 ? 's' : ''}?`)) return;
    const btn = document.getElementById('translate-missing-btn');
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block"></span>Translating...</span>';
    btn.disabled = true;
    try {
      await fetch('/bulk-localize-all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shop, token, tone: 'professional and elegant', glossary: 'checkout, Shopify' })
      });
      await loadData();
    } catch(e) { alert('Error. Please try again.'); }
    finally {
      btn.innerHTML = '<i class="ti ti-player-play"></i>Translate Missing';
      btn.disabled = false;
    }
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('mob-overlay').classList.add('open');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('mob-overlay').classList.remove('open');
  }

  // Delegate click per translate buttons
  document.addEventListener('click', async function(e) {
    const btn = e.target.closest('.translate-btn');
    if (!btn) return;
    const productId = btn.dataset.id;
    if (!productId) return;

    // Try to get token from store-settings if not in localStorage
    let activeToken = token;
    if (!activeToken) {
      try {
        const s = await fetch('/store-settings?shop=' + shop);
        const sd = await s.json();
        activeToken = sd.access_token || null;
        if (activeToken) localStorage.setItem('getoify_token', activeToken);
      } catch(e) {}
    }
    if (!activeToken) { alert('Please reconnect your store first.'); return; }
    const productTitle = decodeURIComponent(btn.dataset.title || '');
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border:2px solid #E0DDD6;border-top-color:#8B7355;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block"></span>Translating</span>';
    btn.disabled = true;
    try {
      const res = await fetch('/process-product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shop, token: activeToken, productId: String(productId), productTitle })
      });
      if (!res.ok) throw new Error('Server error');
      // Poll every 3s up to 30s for translation to complete
      let attempts = 0;
      const poll = setInterval(async () => {
        attempts++;
        await loadData();
        // Check if this product now has translations
        const locales = getLocalesForProduct(String(productId));
        if (locales.length > 0 || attempts >= 10) {
          clearInterval(poll);
        }
      }, 3000);
    } catch(e) {
      btn.textContent = 'Translate';
      btn.disabled = false;
      alert('Error. Please try again.');
    }
  });

  loadData();

  // Live polling — përditëson vetëm statusin e rreshtave çdo 8 sekonda
  // pa bërë reload të listës së produkteve (shumë i shpejtë)
  let livePolling = null;

  function startLivePolling() {
    if (livePolling) return;
    livePolling = setInterval(async () => {
      try {
        const res = await fetch('/status?shop=' + shop);
        const data = await res.json();
        const newMap = {};
        data.translations.forEach(t => {
          const pid = String(t.product_id);
          if (!newMap[pid]) newMap[pid] = [];
          if (!newMap[pid].includes(t.locale)) newMap[pid].push(t.locale);
        });

        // Kontrollo nëse ka ndryshime
        let hasChanges = false;
        for (const pid of Object.keys(newMap)) {
          const oldCount = (translatedMap[pid] || []).length;
          const newCount = newMap[pid].length;
          if (newCount !== oldCount) { hasChanges = true; break; }
        }

        if (hasChanges) {
          translatedMap = newMap;
          renderTable();
          updateStats();
        }
      } catch(e) {}
    }, 8000);
  }

  function stopLivePolling() {
    if (livePolling) { clearInterval(livePolling); livePolling = null; }
  }

  // Fillo polling automatikisht
  startLivePolling();

  // Ndalo polling kur faqja nuk është aktive (kursen API calls)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopLivePolling();
    else startLivePolling();
  });
</script>
</body>
</html>
